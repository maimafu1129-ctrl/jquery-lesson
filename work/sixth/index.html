<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../common/css/reset.css">
  <link rel="stylesheet" href="../../common/css/base.css">
  <link rel="stylesheet" href="./css/style.css">
  <title>Document</title>
</head>

<body>
  <div class="wrapper" id="wrapper">
    <button type="button" class="btn search-btn" id="pokemon_search">ポケモンを探す</button>
  </div>
  <script src="../../common/js/jquery.js"></script>
  <script>
    $(function () {
      let encountHtml = '<button class="btn search-btn">ポケモンを探す</button>';
      $('#wrapper').html(encountHtml);
      $('#wrapper').on('click', ".search-btn", function () {
        let randomId = Math.floor(Math.random() * 151) + 1;
        let monsterUrl = 'https://pokeapi.co/api/v2/pokemon/' + randomId;
        $.ajax({
          url: `https://pokeapi.co/api/v2/pokemon/${randomId}`,
          method: 'GET'
        }).done(function (data) {
          let ja = data.species.url;
          let img = data.sprites.other['official-artwork'].front_default;
          $('.img').attr('src', img);
          $.ajax({
            url: ja,
            method: 'GET'
          }).done(function (res) {
             let name = res.names[0].name;
             $('.name').append(name);
          })
        });
        let choices =
          `
          <p class="name"></p> 
          <div>
            <img class="img" src="" alt="">
            </div>
            <div>
              <button class="btn" id="catch">捕まえる</button>
              <button class="btn" data-js="reset">逃げる</button>
              </div>
              `
        $('#wrapper').html(choices);
        $('[data-js="reset"]').on("click", function () {
          $(".wrapper").html(encountHtml);
        })
        $('#catch').on('click', function () {
          console.log(Math.random());
          if (Math.random() < 0.5) {
            let doneHtml =
              `<div>
                    <p class="name">ゲットしました</p>
                    <div>
                    <img class="img" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png" alt="ポケモンボールの画像">
                    </div>
                    <button class="btn" data-js="reset">戻る</button>
                    `
            $('#wrapper').html(doneHtml);
            $('[data-js="reset"]').on("click", function () {
              $(".wrapper").html(encountHtml);
            })

          } else {
            let failHtml =
              `<div>
                      <p class="text">逃げられてしまった...</p>
                      <button class="btn" data-js="reset">戻る</button>
                      </div>
                      `
            $('#wrapper').html(failHtml);
            $('[data-js="reset"]').on("click", function () {
              $(".wrapper").html(encountHtml);
            })
          }
        });
        $('#wrapper').on('click', '#back-btn, #escape-btn', function () {
          $('#wrapper').html(encountHtml);
        });
      })

    });

  </script>
